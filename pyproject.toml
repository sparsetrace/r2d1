[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r2d1"
version = "0.1.6"
description = "Lightweight ML checkpoint courier — Cloudflare R2 storage + optional D1 metrics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "r2d1 contributors"}]
dependencies = [
  "boto3>=1.28",
  "requests>=2.28",
  "numpy>=1.23",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
torch = ["torch"]
jax = ["jax", "jaxlib"]
dev = ["build", "twine"]
