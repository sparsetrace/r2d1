[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "r2d1"
version     = "0.2.2"
description = "ML checkpoint courier — Cloudflare R2 storage and D1 metadata"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.26",
    "requests>=2.28",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev    = ["pytest>=7", "pytest-mock", "moto[s3]>=5.0"]

[project.scripts]
r2d1 = "r2d1.__main__:main"

[project.urls]
Repository = "https://github.com/yourname/r2d1"

[tool.hatch.build.targets.wheel]
packages = ["src/r2d1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
